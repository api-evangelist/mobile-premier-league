aid: mobile-premier-league
name: Mobile Premier League
description: >-
  Mobile Premier League (MPL) is a mobile skill-gaming and esports platform founded in 2018 and
  headquartered in Bengaluru, India, operated by Galactus Funware Technology. It distributes a
  catalog of casual, card, board and fantasy-sports titles inside a single app and runs
  tournaments and contests around them, reporting more than 100 million registered users across
  Asia, Europe and North America. MPL historically ran a game-developer program — a Developer
  Dashboard and a publish-and-monetize SDK at developer.mpl.live, documented at
  docs.developer.mpl.live — that let third-party studios ship a single build to the MPL app under
  a revenue-share agreement. That program's hosts no longer resolve, and MPL publishes no public
  REST, GraphQL, MCP or event API today. Following India's Promotion and Regulation of Online
  Gaming Act, 2025, MPL discontinued real-money gaming in India; www.mplgames.com is the live
  consumer surface, principally serving the United States.
